version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: alpha-ui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"   # host port different from student-be
    volumes:
      - alpha_ui_postgres_data:/var/lib/postgresql/data
    networks:
      - alpha-ui-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alpha-ui-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5052:80"     # host port different from student-be
    depends_on:
      - postgres
    networks:
      - alpha-ui-network

volumes:
  alpha_ui_postgres_data:

networks:
  alpha-ui-network:
    driver: bridge
