version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: alpha-ui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alpha-ui-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alpha-ui-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5052:80"
    depends_on:
      - postgres
    networks:
      - alpha-ui-network

  app:
    image: node:20-alpine
    container_name: alpha-ui-app
    working_dir: /app
    ports:
      - "4036:4035"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-alsworkflow}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4036}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:4036}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-TLS}
      - SMTP_USER=${SMTP_USER:-info@alpheraacademy.edu.bh}
      - SMTP_PASS=${SMTP_PASS}
      - ODOO_BASE_URL=${ODOO_BASE_URL:-https://smslive.alpheraacademy.edu.bh}
      - ODOO_DB=${ODOO_DB:-sms_new_db}
      - NEXT_PUBLIC_ODOO_BASE_URL=${NEXT_PUBLIC_ODOO_BASE_URL:-https://smslive.alpheraacademy.edu.bh}
      - NEXT_PUBLIC_ODOO_DB=${NEXT_PUBLIC_ODOO_DB:-sms_new_db}
      - FRANK_API_BASE_URL=${FRANK_API_BASE_URL:-https://7d2544990bb2.ngrok-free.app/api/v1}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm prisma generate && pnpm build && PORT=4035 pnpm start"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - alpha-ui-network

volumes:
  postgres_data:

networks:
  alpha-ui-network:
    driver: bridge
